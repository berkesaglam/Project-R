<!DOCTYPE html>
<html lang="tr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Project R</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="app">

        <div class="phone">

            <!-- Splash Screen -->

            <div class="screen" id="splashScreen">

                <div class="splash">

                    <div class="logo">
                        R
                    </div>

                    <h1>PROJECT R</h1>

                    <p class="codename">
                        Confidential
                    </p>

                    <div class="userBox">

                        <span>Yetkili Kullanıcı</span>

                        <h2>Raziye</h2>

                    </div>

                    <div class="loadingText" id="loadingText">

                        Başlatılıyor...

                    </div>

                </div>

            </div>

            <!-- Home Screen -->

            <div class="screen hidden" id="homeScreen">

                <div class="home">

                    <div class="top">

                        <span class="miniTitle">
                            Project R
                        </span>

                        <span class="codeName">
                            Confidential
                        </span>

                    </div>

                    <div class="welcome">

                        <h1 id="greeting">
                            ☀️ Günaydın
                        </h1>

                        <h2>Raziye</h2>

                    </div>

                    <div class="counterCard">

                        ❤️
                        <span id="loveCounter">
                            Hesaplanıyor...
                        </span>

                    </div>

                    <div class="menu">

                        <div class="card" id="chapterCard">

                            <div>

                                <h3>💌 Chapter One</h3>

                                <p>İlk mektubumuz</p>

                            </div>

                            <span>›</span>

                        </div>

                        <div class="card">

                            <div>

                                <h3>📸 Memory Box</h3>

                                <p>Anılarımız</p>

                            </div>

                            <span>›</span>

                        </div>

                        <div class="card">

                            <div>

                                <h3>🎵 Playlist</h3>

                                <p>Bizim şarkılarımız</p>

                            </div>

                            <span>›</span>

                        </div>

                        <div class="card">

                            <div>

                                <h3>⭐ Bucket List</h3>

                                <p>Birlikte yapacaklarımız</p>

                            </div>

                            <span>›</span>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
